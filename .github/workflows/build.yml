name: Build BlackBox Core AAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build BCore & BlackReflection
      run: |
        ./gradlew :black-reflection:jar :BCore:assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --stacktrace

    - name: Merge BlackReflection into BCore AAR
      run: |
        mkdir -p repack
        cd repack
        
        # Ekstrak AAR utama
        unzip -q ../BCore/build/outputs/aar/*-release.aar
        
        # Ekstrak classes.jar utama
        mkdir -p classes_all
        cd classes_all
        jar xf ../classes.jar
        
        # Gabungkan class dari black-reflection
        for f in ../../black-reflection/build/libs/*.jar; do
          [ -e "$f" ] && jar xf "$f"
        done
        
        # Kemas ulang classes.jar utuh
        jar cf ../classes.jar .
        cd ..
        rm -rf classes_all
        
        # Kemas ulang AAR final
        zip -q -r ../BCore-fat-release.aar .
        cd ..

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BCore-release-aar
        path: 'BCore-fat-release.aar'
        
