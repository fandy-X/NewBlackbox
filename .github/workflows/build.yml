name: Build BlackBox Core & Reflection

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK & NDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build BCore & BlackReflection
      run: ./gradlew :black-reflection:jar :BCore:assembleRelease --no-daemon

    - name: Convert to DEX
      run: |
        set -e
        rm -rf dexout && mkdir -p dexout/aar dexout/jni
        unzip -q Bcore/build/outputs/aar/Bcore-release.aar -d dexout/aar
        BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
        PLAT=$(ls $ANDROID_HOME/platforms/*/android.jar | sort -V | tail -1)
        echo "build-tools: $BT"
        echo "platform: $PLAT"
        ${BT}d8 --release --min-api 21 --lib "$PLAT" --output dexout \
          dexout/aar/classes.jar black-reflection/build/libs/*.jar
        cp -r dexout/aar/jni/* dexout/jni/
        cp dexout/aar/AndroidManifest.xml dexout/AndroidManifest.xml
        ls -R dexout | head -60

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlackBox-Build-Output
        path: |
          **/build/outputs/aar/*.aar
          **/build/libs/*.jar
          dexout/classes*.dex
          dexout/jni/**
          dexout/AndroidManifest.xml
