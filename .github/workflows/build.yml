name: Build BlackBox Core AAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build BCore & BlackReflection
      run: |
        ./gradlew :black-reflection:jar :BCore:assembleRelease --stacktrace

    - name: Merge BlackReflection into BCore AAR
      run: |
        mkdir -p repack_aar
        cd repack_aar
        unzip ../BCore/build/outputs/aar/*-release.aar
        
        mkdir -p repack_classes
        cd repack_classes
        jar xvf ../classes.jar
        
        # Merge black-reflection classes
        find ../../black-reflection/build/libs/ -name "*.jar" -exec jar xvf {} \;
        
        # Re-pack full classes.jar
        jar cvf ../classes.jar .
        cd ..
        rm -rf repack_classes
        
        # Package merged AAR
        zip -r ../BCore-fat-release.aar .
        cd ..

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BCore-release-aar
        path: 'BCore-fat-release.aar'
