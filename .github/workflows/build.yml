name: Build BlackBox Core & Reflection

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK & NDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build BCore & BlackReflection
      run: ./gradlew :black-reflection:jar :BCore:assembleRelease --no-daemon

    - name: Convert to DEX
      run: |
        mkdir -p dexout/aar
        unzip -q Bcore/build/outputs/aar/Bcore-release.aar -d dexout/aar
        D8=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)d8
        LIB=$(ls $ANDROID_HOME/platforms/*/android.jar | sort -V | tail -1)
        $D8 --release --min-api 21 --lib "$LIB" --output dexout dexout/aar/classes.jar black-reflection/build/libs/*.jar
        cp dexout/aar/jni/arm64-v8a/libblackbox.so dexout/ || true
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlackBox-Build-Output
        path: |
          **/build/outputs/aar/*.aar
          **/build/libs/*.jar
